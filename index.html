<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Global Alfabet · Providing access</title>
    <meta
      name="description"
      content="Global Alfabet builds Alfa Maps, Alfa Places and Alfa Shop: digital products that help businesses get found, sell online and show buyers what they're getting. One account for all of them."
    />
    <meta property="og:title" content="Global Alfabet · Providing access" />
    <meta
      property="og:description"
      content="Alfa Maps, Alfa Places and Alfa Shop. Digital products for businesses, under one Global Alfabet account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.globalalfabet.com/" />
    <meta property="og:image" content="https://www.globalalfabet.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://www.globalalfabet.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Global Alfabet",
        "url": "https://www.globalalfabet.com",
        "logo": "https://www.globalalfabet.com/brand/global-alfabet/global-alfabet-icon.png",
        "slogan": "Providing access",
        "email": "hello@globalalfabet.com",
        "brand": [
          { "@type": "Brand", "name": "Alfa Maps" },
          { "@type": "Brand", "name": "Alfa Places" },
          { "@type": "Brand", "name": "Alfa Shop" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Lets Netlify Forms detect both forms at build time. Field names must match src/pages/Contact.jsx -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="firstName" /><input name="lastName" /><input name="email" /><input name="phone" /><input
        name="company"
      /><input name="interest" /><input name="subject" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <form name="support" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><input name="product" /><textarea name="message"></textarea><input
        name="bot-field"
      />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
