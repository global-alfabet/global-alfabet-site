<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Page title, description, share tags and structured data come from src/lib/seo.js.
         The build (scripts/prerender.js) replaces everything between these markers for each page. -->
    <!--seo:start-->
    <title>Global Alfabet · Digital products for businesses in Zimbabwe</title>
    <meta name="description" content="Global Alfabet builds Alfa Maps and Alfa Finda, with Alfa Shop and one Global Alfabet Account on the way." />
    <!--seo:end-->
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Lets Netlify Forms detect both forms at build time. Field names must match src/pages/Contact.jsx -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="firstName" /><input name="lastName" /><input name="email" /><input name="phone" /><input
        name="company"
      /><input name="interest" /><input name="subject" /><textarea name="message"></textarea><input name="bot-field" />
    </form>
    <form name="support" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="name" /><input name="email" /><input name="product" /><textarea name="message"></textarea><input
        name="bot-field"
      />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
