[build]
  command = "npm run build"
  publish = "dist"
  # submission-created.mjs emails a confirmation to whoever fills in a form (needs RESEND_API_KEY, see README.md)
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Old page addresses keep working. force: products.html etc. now exist as files, and the old .html addresses
# should still move to the clean ones rather than show the same page twice.
[[redirects]]
  from = "/products.html"
  to = "/products"
  status = 301
  force = true
[[redirects]]
  from = "/blog.html"
  to = "/blog"
  status = 301
  force = true
[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true
[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true
[[redirects]]
  from = "/article.html"
  to = "/blog"
  status = 301
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/admin"
  to = "/"
  status = 301
[[redirects]]
  from = "/admin.html"
  to = "/"
  status = 301

# Every page is built as its own HTML file (scripts/prerender.js): /products is served from products.html.
# Any other address gets 404.html with a real 404 status, so search engines don't index missing pages.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Logos are public so Adobe Express designs and partners can link to them
[[headers]]
  for = "/brand/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=86400"
